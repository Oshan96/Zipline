<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zipline Download Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a6cf0'/%3E%3Cpath d='M17.5 5 9 18h6l-1.5 9L23 14h-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/*ZL_COLORS*/
/* The page a browser gets at Zipline's address without the window's sign-in (session.go): how to open
   the window, nothing else. Styled like the window's dialogs. */
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
main{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:24px 28px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:14px}
.brand svg{flex:none}
h1{font-size:17px;font-weight:600;line-height:1.3;margin:0 0 8px}
p{margin:0}
.hint{color:var(--muted);font-size:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
code{font:12px ui-monospace,Consolas,"Cascadia Mono",Menlo,monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
@media (max-width:480px){main{padding:20px 18px;border-radius:10px}h1{font-size:16px}}
</style>
<script>try { const theme = localStorage.getItem("zl.theme"); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
</head>
<body>
<main>
  <div class="brand"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1a6cf0"/><path d="M17.5 5 9 18h6l-1.5 9L23 14h-6z" fill="#fff"/></svg><span>Zipline</span></div>
  <h1 id="lock-t"></h1>
  <p id="lock-b"></p>
  <p class="hint" id="lock-h"></p>
</main>
<script src="/i18n.js"></script>
<script>
document.title = t("app.title");
document.getElementById("lock-t").textContent = t("lock.title");
document.getElementById("lock-b").innerHTML = ht("lock.body");
document.getElementById("lock-h").innerHTML = ht("lock.cli");
</script>
</body>
</html>
