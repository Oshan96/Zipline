<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zipline">
<meta name="referrer" content="no-referrer">
<title>Zipline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a6cf0'/%3E%3Cpath d='M17.5 5 9 18h6l-1.5 9L23 14h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a6cf0'/%3E%3Cpath d='M17.5 5 9 18h6l-1.5 9L23 14h-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/*ZL_COLORS*/
:root{--gut:16px; --r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--ctl);background:var(--panel);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.btn.danger{color:var(--err)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--ctl);border-radius:10px;background:var(--panel);font-size:16px}
.inp:focus{border-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
.muted{color:var(--muted)}
.logo{width:28px;height:28px;flex:none}

/* pairing */
.pair{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) var(--gut) 32px}
.pair .logo{width:56px;height:56px;margin-bottom:16px}
.pair h1{font-size:24px;margin:0 0 8px}
.pair h1:focus{outline:none}
.pair p{margin:0 0 20px;color:var(--muted)}
.pair .inp{font:600 20px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;text-transform:uppercase}
.pair .msg{min-height:22px;margin:10px 0 14px;font-size:14px}
.pair .msg.bad{color:var(--err)}
.pair ol{padding-left:20px;margin:28px 0 0;color:var(--muted);line-height:1.6;font-size:14px}

/* app */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) var(--gut) 0;border-bottom:1px solid var(--line2)}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{font-size:19px;margin:0;flex:1;min-width:0}
.speed{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.speed b{color:var(--text);font-weight:600}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{background:var(--line2)}
.iconbtn svg{width:22px;height:22px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px 0 10px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:48px;padding:4px 6px;border:1px solid var(--ctl);background:var(--panel);border-radius:14px;font-size:13px;font-weight:500;line-height:1.2}
.tab .n{color:var(--muted);font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.tab.on .n{color:inherit;opacity:.9}
.banner{margin:12px var(--gut) 0;padding:10px 12px;border-radius:10px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.act{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 12px;font-variant-numeric:tabular-nums}
.banner.act span{flex:1;min-width:0}
.banner.act .btn{flex:none;padding:0 16px}
main{padding:12px var(--gut) calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card:active{background:var(--panel2)}
.row1{display:flex;gap:10px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none;background:var(--muted)}
.name{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{display:block;height:6px;border-radius:3px;background:var(--barBg);margin:10px 0 8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width var(--t-slow)}
.card.done .pb i{background:var(--ok)}
.card.err .pb i{background:var(--err)}
.card.paused .pb i{background:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta span:empty{display:none}
.meta .st{font-weight:500}
.card.done .st{color:var(--ok)}
.card.err .st{color:var(--err)}
.why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.why:empty{display:none}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty svg{width:48px;height:48px;opacity:.5;margin-bottom:8px}
.fab{position:fixed;right:max(var(--gut),env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;border:0;background:var(--accent);color:var(--accentText);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;z-index:6}
.fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;opacity:0;transition:opacity var(--t);touch-action:none}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:8px var(--gut) calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform var(--t) ease-out;max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sheet:focus{outline:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 4px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sheet h2{flex:1;min-width:0;font-size:18px;margin:0;padding:8px 0;overflow-wrap:anywhere}
.shead .iconbtn{border-radius:50%;background:var(--line2);margin-right:-4px}
.shead .iconbtn:active{background:var(--line)}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 16px;overflow-wrap:anywhere}
.sheet .sub.why{display:block;margin-top:-8px}
.sheet .sub:empty{display:none}
.sheet .acts{display:grid;gap:10px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .btn{min-height:48px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line2)}
.line label{flex:1;min-width:0}
.line select.inp{width:auto;min-height:44px;max-width:55%;padding:6px 10px}
.switch{width:100%;padding:0;border-width:0 0 1px;border-radius:0;background:none;text-align:left}
.switch .track{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--muted);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--accentText);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(20px)}
.qrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2)}
.qrow .q{flex:1;min-width:0;overflow-wrap:anywhere}
.qrow .q small{display:block;color:var(--muted)}
.qrow .btn{flex:none;min-height:44px;padding:0 16px}
.quota{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--panel2);border:1px solid var(--line2)}
.quota b{font-variant-numeric:tabular-nums}
.quota.over{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tn-ok{color:var(--ok)}.tn-warn{color:var(--warn)}.tn-err{color:var(--err)}.tn-m{color:var(--muted)}
.wait{display:flex;align-items:center;gap:12px;min-height:56px;color:var(--muted);margin-bottom:6px}
.spin{flex:none;width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.box{margin:0 0 14px;padding:10px 12px;border-radius:10px;font-size:14px;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line2)}
.box.info{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.box.bad{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.box .btn{width:100%;margin-top:10px}
.hint{margin:6px 0 14px;color:var(--muted);font-size:13px}
.hint:last-child{margin-bottom:0}
.sheet .sub.link{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.thead{margin:0 0 14px}
.thead b{display:block;font-weight:600;overflow-wrap:anywhere}
.thead .sub{margin:2px 0 0}
.facts{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 14px;margin:0 0 14px;font-size:14px}
.facts>div:nth-child(odd){color:var(--muted)}
.facts>div{overflow-wrap:anywhere}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));z-index:1;margin:8px calc(-1 * var(--gut)) calc(-18px - env(safe-area-inset-bottom));padding:10px var(--gut) calc(18px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line2)}
.sheet .two .btn{padding:6px 10px;line-height:1.2;text-align:center}
.lim{display:flex;gap:10px;align-items:center}
.lim .inp{flex:1;min-width:0}
.lim .btn{flex:none;padding:0 18px}
.sheet input[type=checkbox]{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.fold{margin:0 0 14px;border-bottom:1px solid var(--line2)}
.fold summary{display:flex;align-items:center;min-height:48px;cursor:pointer;font-weight:500;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";margin:-4px 4px 0 auto;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform var(--t-fast)}
.fold[open] summary::after{transform:translateY(4px) rotate(-135deg)}
.fl-head{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line2)}
.fl-head label{flex:1;display:flex;align-items:center;gap:12px;min-height:48px;min-width:0;font-weight:500}
.fl-sel{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.fl-row{padding:4px 0 8px;border-bottom:1px solid var(--line2)}
.fl-pick{display:flex;align-items:flex-start;gap:12px;min-height:34px;padding-top:6px}
.fl-name{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.fl-dir{color:var(--muted)}
.fl-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:34px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.fl-sub select{min-height:36px;max-width:50%;padding:0 8px;border:1px solid var(--ctl);border-radius:8px;background:var(--panel);font-size:14px}
.pair .acts{display:grid;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);opacity:0;transition:opacity var(--t);pointer-events:none}
.toast.show{opacity:1}
.toast.top{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
@media (max-width:350px){ .tab{font-size:12px} }
@media (min-width:480px){ .tabs{display:flex} .tab{flex-direction:row;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;font-size:14px} .tab .n{font-size:14px} }
@media (min-width:700px){ main{padding-top:20px} .sheet{border-radius:18px;bottom:24px} }
/* Windows high contrast: system colours for the filled things, and bars that show up as an outline */
@media (forced-colors: active){
  :root .tab.on,:root .fab{background:Highlight;color:HighlightText;forced-color-adjust:none}
  :root .btn.primary{background:ButtonFace;color:ButtonText;border:2px solid Highlight}
  :root .pb{background:Canvas;outline:1px solid CanvasText}
  :root .pb i{background:Highlight}
  :root .toast{background:Canvas;color:CanvasText;border:1px solid CanvasText}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .spin{animation-duration:3s} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1a6cf0"/><path d="M17.5 5 9 18h6l-1.5 9L23 14h-6z" fill="#fff"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
</defs></svg>

<section id="pair" class="pair" hidden>
  <svg class="logo"><use href="#i-logo"/></svg>
  <h1 id="pairtitle" tabindex="-1"></h1>
  <p id="pairintro"></p>
  <form id="pairform" autocomplete="off">
    <input class="inp" id="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="22" placeholder="XXXX-XXXX-XXXX-XXXX">
    <div class="msg" id="pairmsg"></div>
    <button class="btn primary block" id="pairbtn"></button>
  </form>
  <ol>
    <li id="step1"></li>
    <li id="step2"></li>
    <li id="step3"></li>
  </ol>
</section>

<section id="await" class="pair" hidden>
  <svg class="logo"><use href="#i-logo"/></svg>
  <h1 id="awaittitle" tabindex="-1"></h1>
  <p id="awaitbody" role="status"></p>
  <div class="wait" id="awaitspin" aria-hidden="true"><span class="spin"></span></div>
  <div class="acts">
    <button type="button" class="btn primary block" id="awaitagain" hidden></button>
    <button type="button" class="btn block" id="awaitcancel"></button>
  </div>
</section>

<section id="app" hidden>
  <header class="top">
    <div class="bar">
      <svg class="logo"><use href="#i-logo"/></svg>
      <h1>Zipline</h1>
      <span class="speed" id="speed"></span>
      <button class="iconbtn" id="menu" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#i-more"/></svg></button>
    </div>
    <div class="tabs" id="tabs" role="group"></div>
  </header>
  <div class="banner" id="offline" hidden role="status"></div>
  <div class="banner act" id="power" hidden role="status"><span id="powertext"></span><button class="btn" id="powercancel"></button></div>
  <div class="banner" id="quotaover" hidden role="status"></div>
  <main>
    <div id="list"></div>
    <div class="empty" id="empty" hidden><svg aria-hidden="true"><use href="#i-box"/></svg><div id="emptytext"></div></div>
  </main>
  <button class="fab" id="add"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/*ZL_I18N*/
const $ = s => document.querySelector(s);

/*SIG*/
// SHA-256 and HMAC (this page is served over plain http on the home network, where browsers
// don't offer their built-in crypto)
const K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l / 0x20000000));
  const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = w[i - 16] + ((a >>> 7 | a << 25) ^ (a >>> 18 | a << 14) ^ (a >>> 3)) + w[i - 7] + ((b >>> 17 | b << 15) ^ (b >>> 19 | b << 13) ^ (b >>> 10));
    }
    let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], k = h[7];
    for (let i = 0; i < 64; i++) {
      const t1 = (k + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) | 0;
      const t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      k = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += k;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, h[i]);
  return out;
}
const utf8 = s => new TextEncoder().encode(s);
const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
function hmac(key, msg) {

    + (live ? `<div class="box bad">${te("ph.noLive")}</div>` : "");
  const facts = [];
  if (hls) facts.push([te("fact.type"), ht(live ? (info.event ? "fi.eventType" : "fi.liveType") : info.fmp4 && info.format !== "DASH" ? "fi.hlsTypeMp4" : "fi.hlsType", { format: info.format || "HLS" })]);
  else if (fold) facts.push([te("fact.type"), ht(fold.total > 0 ? "fi.folderSize" : "fi.folder", { n: mlFiles.length, size: fmtSize(fold.total) })]);
  else if (ml) facts.push([te("fact.type"), ht(ml.total > 0 ? "fi.metalinkSize" : "fi.metalink", { n: mlFiles.length, size: fmtSize(ml.total) })]);
  else {
    facts.push([te("fact.size"), esc(info.size > 0 ? fmtSize(info.size) : t("size.unknown"))]);
    if (info.mime) facts.push([te("fact.type"), esc(info.mime)]);
  }
  if (S.plan && S.plan.on) facts.push([te("fact.freeHours"), esc(cap(planWindowText(S.plan)))]);
  const files = !multi ? "" : `<div class="field"><label for="mlf">${te("f.download")}</label><select class="inp" id="mlf"><option value="-1">${te(ml.total > 0 ? "fi.allFilesSize" : "fi.allFiles", { n: mlFiles.length, size: fmtSize(ml.total) })}</option>${mlFiles.map((f, i) => `<option value="${i}">${esc(f.name)}${f.size > 0 ? ` (${esc(fmtSize(f.size))})` : ""}</option>`).join("")}</select></div>`;
  sheet(t("a.addLink"), `${boxes}
    <p class="sub link">${esc(url)}</p>
    ${files}
    <div class="field"><label for="nm">${te("f.fileName")}</label><input class="inp" id="nm" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="qsel">${te("f.laterInto")}</label><select class="inp" id="qsel">${queueOptions(laterQueue())}</select></div>
    <div class="facts">${facts.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("")}</div>
    ${hls && !blocked && !live ? `<p class="hint">${te("ph.hlsAuto")}</p>` : ""}
    <div class="stick two"><button type="button" class="btn" id="later"></button><button type="button" class="btn primary" id="now">${te("fi.start")}</button></div>`, sh => {
    const nameIn = sh.querySelector("#nm"), qsel = sh.querySelector("#qsel"), later = sh.querySelector("#later"), now = sh.querySelector("#now"), mlf = sh.querySelector("#mlf");
    nameIn.value = name;
    sh.querySelector("#renew") && (sh.querySelector("#renew").onclick = async e => {
      e.currentTarget.disabled = true;
      const ok = await act(async () => noError(await api("renew", { id: match.id, url })), th("ph.renewed", { name: nm(match.name) }));
      if (!ok && sheetOpen) e.currentTarget.disabled = false;
    });
    const laterLabel = () => setText(later, t(qsel.value === PLAN_Q ? "fi.laterFree" : "fi.later"));
    qsel.onchange = laterLabel; laterLabel();
    if (mlf) mlf.onchange = () => { // one file of a metalink has a name of its own; all of them keep theirs
      const i = +mlf.value;
      nameIn.disabled = i < 0; nameIn.value = i < 0 ? t("fi.eachOwnName") : mlFiles[i].name;
    };
    if (mlf) mlf.onchange();
    later.disabled = now.disabled = blocked || live;
    const go = start => {
      const body = { url, name: nameIn.disabled ? "" : nameIn.value.trim(), queueId: qsel.value, probed: true, size: !hls && !ml && info.size > 0 ? info.size : 0 };
      if (ml) Object.assign(body, { meta: true, metaFile: multi ? +mlf.value : 0 });
      sendAdd(sh, body, start);
    };
    now.onclick = () => go(true);
    later.onclick = () => go(false);
  });
}

// ---- a torrent's files: a tick for each, and how soon (Skip, Low, Normal, High), as in the window
const PRIOS = [["skip", "prio.skip"], ["-1", "prio.low"], ["0", "prio.normal"], ["1", "prio.high"]];
const prioValue = (on, p) => on ? String(p || 0) : "skip";
const FILE_CAP = 1000; // (the phone shows this many; the rest keep the choice made for "all")
// fileModel keeps which files are wanted and their priority
function fileModel(files, count) {
  const list = [...files].sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: "base" }));
  for (const f of list) count = Math.max(count || 0, f.i + 1);
  const checked = new Set(list.filter(f => !f.skip).map(f => f.i)), prio = new Map(list.filter(f => f.prio).map(f => [f.i, f.prio]));
  return { list, checked, prio,
    size: () => list.reduce((a, f) => a + (checked.has(f.i) ? f.size : 0), 0),
    pick: () => ({ skip: Array.from({ length: count }, (_, i) => !checked.has(i)), prio: Array.from({ length: count }, (_, i) => prio.get(i) || 0) }) };
}
// fileRows draws the list in box; changed is called after every tick or priority
function fileRows(box, fm, changed) {
  const n = fm.list.length;
  const row = f => {
    const at = f.path.lastIndexOf("/"), nameOnly = f.path.slice(at + 1), v = prioValue(fm.checked.has(f.i), fm.prio.get(f.i));
    return `<div class="fl-row"><label class="fl-pick"><input type="checkbox" data-i="${f.i}"${fm.checked.has(f.i) ? " checked" : ""}><span class="fl-name">${at >= 0 ? `<span class="fl-dir">${esc(f.path.slice(0, at + 1))}</span>` : ""}${esc(nameOnly)}</span></label>
      <div class="fl-sub"><span>${esc(fmtSize(f.size))}</span><select data-p="${f.i}" aria-label="${te("tor.prioAria", { name: nm(nameOnly) })}">${PRIOS.map(([x, id]) => `<option value="${x}"${x === v ? " selected" : ""}>${te(id)}</option>`).join("")}</select></div></div>`;
  };
  box.innerHTML = `<div class="fl-head"><label><input type="checkbox" id="fl-all"><span>${te("tor.files")}</span></label><span class="fl-sel" id="fl-sel"></span></div>
    <div class="fl-list">${fm.list.slice(0, FILE_CAP).map(row).join("")}</div>${n > FILE_CAP ? `<p class="hint">${te("tor.firstN", { n: FILE_CAP })}</p>` : ""}`;
  const all = box.querySelector("#fl-all"), sel = box.querySelector("#fl-sel");
  const sync = () => {
    all.checked = fm.checked.size === n; all.indeterminate = fm.checked.size > 0 && fm.checked.size < n;
    setText(sel, t("tor.chosen", { checked: fm.checked.size, n, size: fmtSize(fm.size()) }));
    changed();
  };
  box.onchange = e => {
    const x = e.target;
    if (x === all) {
      fm.list.forEach(f => x.checked ? fm.checked.add(f.i) : fm.checked.delete(f.i));
      box.querySelectorAll("input[data-i]").forEach(c => { c.checked = x.checked; const s = box.querySelector(`select[data-p="${c.dataset.i}"]`); s.value = prioValue(x.checked, fm.prio.get(+c.dataset.i)); });
    } else if (x.dataset.i !== undefined) {
      const i = +x.dataset.i;
      x.checked ? fm.checked.add(i) : fm.checked.delete(i);
      box.querySelector(`select[data-p="${i}"]`).value = prioValue(x.checked, fm.prio.get(i));
    } else if (x.dataset.p !== undefined) {
      const i = +x.dataset.p;
      if (x.value === "skip") fm.checked.delete(i); else { fm.checked.add(i); fm.prio.set(i, +x.value); }
      box.querySelector(`input[data-i="${i}"]`).checked = x.value !== "skip";
    } else return;
    sync();
  };
  sync();
}

// torrentSheet is the Add dialog for a torrent (a .torrent link or a magnet link): where it goes, which files
// (a magnet link's list arrives from peers meanwhile), and the in-order options.
function torrentSheet(url, info) {
  const link = info.url || url, magnet = /^magnet:/i.test(link);
  let fm = null, timer = 0, added = false;
  const setFiles = () => { fm = info.files && info.files.length ? fileModel(info.files, info.fileCount || 0) : null; };
  setFiles();
  sheet(t("tor.title"), `${info.exists ? `<div class="box info">${ht("tor.exists", { name: nm(info.exists) })}</div>` : ""}
    <div class="thead"><b id="tname"></b><p class="sub" id="tsub"></p></div>
    <div class="field"><label for="qsel">${te("f.laterInto")}</label><select class="inp" id="qsel">${queueOptions(laterQueue())}</select></div>
    <details class="fold"><summary>${te("ph.moreOpts")}</summary>
      <button type="button" class="line switch" role="switch" aria-checked="false" id="tseq"><span>${te("tor.seq")}</span><i class="track" aria-hidden="true"></i></button>
      <button type="button" class="line switch" role="switch" aria-checked="false" id="tends"><span>${te("tor.ends")}</span><i class="track" aria-hidden="true"></i></button>
      <p class="hint">${te("tor.orderHint")}</p>
    </details>
    <div id="tfiles"></div>
    <div class="stick two"><button type="button" class="btn" id="later"></button><button type="button" class="btn primary" id="now">${te("fi.start")}</button></div>`, sh => {
    const me = sheetN, qsel = sh.querySelector("#qsel"), later = sh.querySelector("#later"), now = sh.querySelector("#now"), box = sh.querySelector("#tfiles");
    const sw = sh.querySelectorAll(".switch");
    sw.forEach(b => b.onclick = () => b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"));
    const laterLabel = () => setText(later, t(qsel.value === PLAN_Q ? "fi.laterFree" : "fi.later"));
    qsel.onchange = laterLabel; laterLabel();
    const sync = () => { later.disabled = now.disabled = !!info.exists || !!fm && fm.list.length > 1 && !fm.checked.size; };
    const draw = () => {
      setText(sh.querySelector("#tname"), info.name || t("tor.default"));
      setText(sh.querySelector("#tsub"), fm ? t(info.private ? "tor.subPrivate" : "tor.sub", { size: fmtSize(info.size), n: fm.list.length }) : t("tor.sizeUnknown"));
      if (!fm) box.innerHTML = `<div class="wait" role="status"><span class="spin" aria-hidden="true"></span><div><b>${te("tor.getting")}</b><div class="hint" id="tpeers">${te("tor.looking")}</div></div></div>`;
      else if (fm.list.length > 1) fileRows(box, fm, sync);
      else box.innerHTML = "";
      sync();
    };
    draw();
    // a magnet link's file list comes from peers: ask until it's there (and tell the computer when it's no longer wanted)
    if (!fm && magnet) {
      const poll = async () => {
        if (me !== sheetN) return;
        let r = null;
        try { r = await api("tmeta", { url: link }); } catch (e) { if (e instanceof AuthError) return unpaired(e.message); }
        if (me !== sheetN) return;
        if (r && r.files) { Object.assign(info, { name: r.name, size: r.size, private: r.private, fileCount: r.fileCount, files: r.files, exists: r.exists || info.exists }); setFiles(); draw(); return; }
        const p = sh.querySelector("#tpeers");
        if (p && r) setText(p, r.peers ? t("ph.torPeers", { n: r.peers, pct: r.metaPct ? fmtPct(r.metaPct, 0) : "none" }) : t("ph.torLooking"));
        timer = setTimeout(poll, 1500);
      };
      poll();
    }
    sheetEnd = () => { clearTimeout(timer); if (magnet && !added) api("tmeta", { url: link, stop: true }).catch(() => {}); };
    const go = async start => {
      const body = { url: link, queueId: qsel.value, probed: true, seq: sw[0].getAttribute("aria-checked") === "true", ends: sw[1].getAttribute("aria-checked") === "true", ...(fm ? fm.pick() : {}) };
      if (await sendAdd(sh, body, start)) added = true;
    };
    now.onclick = () => go(true);
    later.onclick = () => go(false);
  });
}

// filesSheet changes which files of a torrent in the list are downloaded, and how soon
async function filesSheet(d) {
  const me = sheet(t("tor.files"), `<div class="wait" role="status"><span class="spin" aria-hidden="true"></span><span>${te("btn.loading")}</span></div>`);
  let r;
  try { r = await api("tfiles", { id: d.id }); }
  catch (e) {
    if (e instanceof AuthError) return unpaired(e.message);
    if (e instanceof WaitError) return start(key, "saved");
    r = { error: e.message };
  }
  if (me !== sheetN) return;
  if (r.error || !r.files || !r.files.length) {
    sheet(t("tor.files"), `<div class="box bad">${esc(r.error ? cap(r.error) : t("ph.noFiles"))}</div><div class="acts"><button type="button" class="btn" id="x">${te("btn.close")}</button></div>`, sh => { sh.querySelector("#x").onclick = closeSheet; });
    return;
  }
  const fm = fileModel(r.files, r.fileCount || 0);
  sheet(t("tor.files"), `<div class="thead"><b><bdi>${esc(d.name)}</bdi></b></div><div id="tfiles"></div>
    <div class="stick two"><button type="button" class="btn" id="no">${te("btn.cancel")}</button><button type="button" class="btn primary" id="save">${te("btn.save")}</button></div>`, sh => {
    const save = sh.querySelector("#save");
    const draw = () => { save.disabled = fm.list.length > 1 && !fm.checked.size; };
    fileRows(sh.querySelector("#tfiles"), fm, draw);
    sh.querySelector("#no").onclick = closeSheet;
    save.onclick = () => { save.disabled = true; act(async () => noError(await api("tpick", { id: d.id, ...fm.pick() })), t("ph.filesSaved")).then(ok => { if (!ok && sheetOpen) draw(); }); };
  });
}

// noError turns an answer that says what went wrong into an error (shown as a note).
const noError = r => { if (r && r.error) throw new Error(r.error); return r; };
function quotaHTML() {
  const q = S.quota;
  if (!q) return "";
  return `<div class="quota${q.over ? " over" : ""}">${ht("ph.quota", { period: t(q.period === "month" ? "quota.month" : "quota.today"), used: fmtSize(q.used), limit: fmtSize(q.limit), hasNet: q.net ? "y" : "n", net: nm(q.net || ""), over: q.over ? "yes" : "no" })}</div>`;
}
function menuSheet() {
  const qs = (S.queues || []).map(q => `<div class="qrow"><div class="q"><bdi>${esc(q.name)}</bdi><small>${te(q.running ? "sb.running" : "ph.qStopped")}</small></div><button type="button" class="btn" aria-label="${te(q.running ? "a.stopNamed" : "a.startNamed", { name: q.name })}" data-q="${esc(q.id)}" data-run="${q.running ? 1 : 0}">${te(q.running ? "a.stop" : "a.start")}</button></div>`).join("");
  const p = S.profile, profs = p && p.list && p.list.length ? p.list : [];
  const until = p && p.until ? fmtClock(new Date(p.until)) : "";
  sheet("Zipline", `<p class="sub">${te("ph.connected")}</p>
    ${quotaHTML()}
    ${profs.length ? `<div class="line"><label for="prof">${te("ph.profLabel", { hasUntil: until ? "y" : "n", time: until })}</label><select class="inp" id="prof">${profs.map(x => `<option value="${esc(x.id)}"${x.id === p.id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>` : ""}
    <button type="button" class="line switch" id="lim" role="switch" aria-checked="${!!S.limit.on}"><span>${te("a.speedLimiter")}${S.limit.kb ? ` (${esc(fmtSpeed(S.limit.kb * 1024))})` : ""}</span><i class="track" aria-hidden="true"></i></button>
    ${qs ? `<div style="margin-top:6px">${qs}</div>` : ""}
    <div class="acts" style="margin-top:18px"><button type="button" class="btn danger block" id="forget">${te("ph.unpair")}</button></div>`, sh => {
    const lim = sh.querySelector("#lim");
    lim.onclick = () => { const on = lim.getAttribute("aria-checked") !== "true"; act(() => api("limit", { on, kb: S.limit.kb }), t(on ? "ph.limiterOn" : "ph.limiterOff")); };
    const pr = sh.querySelector("#prof");
    if (pr) pr.onchange = () => act(async () => noError(await api("profile", { id: pr.value })), th("profile.switched", { name: nm(pr.selectedOptions[0].textContent) }));
    sh.querySelectorAll("[data-q]").forEach(b => b.onclick = () => b.dataset.run === "1" ? act(async () => noError(await api("queue", { action: "stop", id: b.dataset.q })), "") : startQueue(b.dataset.q, false));
    sh.querySelector("#forget").onclick = async () => {
      closeSheet();
      try { await api("unpair", {}); } catch {} // the computer forgets this phone's key too
      store.set(""); key = "";
      unpaired(t("ph.unpaired", { path: phPath() }));
    };
  });
}

$("#tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; tab = b.dataset.t; try { sessionStorage.setItem("zl-tab", tab); } catch {} render(); };
$("#list").onclick = e => { const c = e.target.closest("[data-id]"); if (!c) return; const d = S.downloads.find(x => x.id === c.dataset.id); if (d) itemSheet(d); };
$("#add").onclick = addSheet;
$("#menu").onclick = menuSheet;

// ---- pairing
function showPair(msg) {
  clearTimeout(poll); fresh++; waiting++; // (an answer still on its way is dropped)
  closeSheet();
  $("#app").hidden = true; $("#await").hidden = true; $("#pair").hidden = false;
  const m = $("#pairmsg"); m.textContent = msg || ""; m.className = "msg" + (msg ? " bad" : "");
  $("#pairtitle").focus({ preventScroll: true });
}
function unpaired(why) { // while in use
  store.set(""); key = "";
  showPair(why === "not paired" ? t("ph.notPaired", { path: phPath() }) : why);
}
// showAwait: the computer is asking whether to let this phone in (or, late, hasn't answered)
function showAwait(late) {
  clearTimeout(poll); fresh++;
  closeSheet();
  $("#app").hidden = true; $("#pair").hidden = true; $("#await").hidden = false;
  $("#awaitbody").innerHTML = late ? te("ph.askLate") : ht("ph.waitBody", { name: nm(phoneName()), allow: t("pair.allow") });
  $("#awaitspin").hidden = late; $("#awaitagain").hidden = !late;
  $("#awaittitle").focus({ preventScroll: true });
}
$("#awaitagain").onclick = () => start(key, "saved");
$("#awaitcancel").onclick = async () => {
  waiting++;
  try { await api("unpair", {}); } catch {} // the computer forgets the code too
  store.set(""); key = "";
  showPair("");
};
let waiting = 0; // counts the tries to connect: a newer one, or giving up, ends an older one still waiting
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function start(code, how) { // how: "typed", "link" or "saved"
  key = normCode(code);
  const me = ++waiting, until = Date.now() + 110000;
  let asked = false; // the waiting screen is up
  for (;;) {
    let r = null;
    try {
      r = await api("hello", { name: phoneName() });
    } catch (e) {
      if (me !== waiting) return false;
      if (e instanceof AuthError) {
        store.set(""); key = "";
        showPair(e.message !== "not paired" ? e.message : how === "saved" ? t("ph.notPaired", { path: phPath() }) : t("ph.badCode", { path: phPath() }));
        return false;
      }
      $("#offline").hidden = false; // can't reach the computer right now: keep trying
    }
    if (me !== waiting) return false;
    if (r && r.denied) { store.set(""); key = ""; showPair(t("ph.denied", { path: phPath() })); return false; }
    if (!r || !r.wait) break;
    store.set(key); // (a reload then carries on waiting)
    if (Date.now() > until) { showAwait(true); return false; }
    if (!asked) { asked = true; showAwait(false); }
    await sleep(2000);
  }
  store.set(key);
  $("#pair").hidden = $("#await").hidden = true; $("#app").hidden = false;
  refresh();
  return true;
}
$("#pairform").onsubmit = async e => {
  e.preventDefault();
  const v = normCode($("#code").value), m = $("#pairmsg");
  if (v.length !== 16) { m.textContent = t("ph.codeLen"); m.className = "msg bad"; return; }
  $("#pairbtn").disabled = true; m.textContent = t("ph.pairing"); m.className = "msg";
  await start(v, "typed");
  $("#pairbtn").disabled = false;
};
$("#code").oninput = e => { const v = normCode(e.target.value).slice(0, 16); e.target.value = v.replace(/(.{4})(?=.)/g, "$1-"); };

// words fills in the page's own text, which the markup leaves empty
(function words() {
  $("#pairtitle").textContent = t("ph.pairTitle"); $("#pairintro").textContent = t("ph.pairIntro");
  $("#code").setAttribute("aria-label", t("ph.codeAria")); $("#pairbtn").textContent = t("ph.pairBtn");
  $("#step1").textContent = t("ph.step1", { path: phPath() });
  $("#step2").innerHTML = ht("ph.step2", { add: t("o.phAdd") });
  $("#step3").textContent = t("ph.step3");
  $("#awaittitle").textContent = t("ph.waitTitle"); $("#awaitagain").textContent = t("a.tryAgain"); $("#awaitcancel").textContent = t("btn.cancel");
  $("#menu").setAttribute("aria-label", t("ph.more")); $("#tabs").setAttribute("aria-label", t("ph.show"));
  $("#offline").textContent = t("ph.offline"); $("#powercancel").textContent = t("btn.cancel");
  $("#add").setAttribute("aria-label", t("a.addLink"));
})();

(function boot() {
  const frag = new URLSearchParams(location.hash.slice(1)).get("k");
  if (frag) history.replaceState(null, "", location.pathname); // keep the code out of the address bar and history
  const saved = store.get();
  if (frag) start(frag, "link"); else if (saved) start(saved, "saved"); else showPair("");
})();
</script>
